<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f4f6">
  <title>Qwerty 드로잉</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/shapes.js" defer></script>
  <script src="js/raster.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- 홈 화면 -->
  <section id="home" class="screen">
    <header class="home-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Qwerty</h1>
      </div>
      <button id="btn-new" class="btn primary" type="button">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        새 프로젝트
      </button>
    </header>
    <main class="home-main">
      <h2 class="section-title">내 프로젝트</h2>
      <div id="project-grid" class="project-grid"></div>
      <div id="empty" class="empty" hidden>
        <p class="empty-title">아직 프로젝트가 없어요</p>
        <p class="empty-sub">새 프로젝트를 만들어 그림을 그려 보세요.</p>
      </div>
    </main>
  </section>

  <!-- 작업 화면 -->
  <section id="editor" class="screen" hidden>
    <header class="topbar">
      <button id="btn-home" class="icon-btn" type="button" title="홈으로">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="project-name" class="project-name" type="button" title="이름 바꾸기"></button>
      <nav id="tabs" class="tabs" aria-label="캔버스"></nav>
      <div class="topbar-actions">
        <button id="btn-undo" class="icon-btn" type="button" title="실행 취소 (Ctrl+Z)">
          <svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" type="button" title="다시 실행 (Ctrl+Shift+Z)">
          <svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
        <span class="divider"></span>
        <button id="btn-layers" class="icon-btn toggle" type="button" title="레이어 표시" aria-pressed="false">
          <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
        </button>
        <div class="menu-wrap">
          <button id="btn-download" class="btn primary small" type="button" title="기본 캔버스를 PNG로 저장">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
            <span class="label">이미지 다운로드</span>
          </button>
          <div id="download-menu" class="menu" hidden>
            <button type="button" data-bg="white">흰 배경 PNG</button>
            <button type="button" data-bg="transparent">투명 배경 PNG</button>
            <p class="menu-note">기본 캔버스 안쪽만 저장돼요</p>
          </div>
        </div>
      </div>
    </header>

    <div class="workspace">
      <div id="stage" class="stage">
        <canvas id="board"></canvas>

        <div id="board-badge" class="board-badge"></div>
        <button id="auto-badge" class="auto-badge" type="button" title="눌러서 자동 그룹 끄기" hidden></button>
        <div id="context-bar" class="context-bar"></div>

        <aside id="toolbar" class="toolbar" aria-label="도구">
          <div class="tool-grid">
            <button class="tool" type="button" data-tool="pen" title="펜 (P)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16l-1 4z"/><path d="M14 7l3 3"/></svg>
            </button>
            <button class="tool" type="button" data-tool="magic" title="매직 펜 (M)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 20L14.5 9.5"/><path d="M12.5 7.5l4 4"/><path d="M18 3v3M16.5 4.5h3M7 4v2M6 5h2M19 14v2M18 15h2"/></svg>
            </button>
            <button class="tool" type="button" data-tool="shape" title="도형 (R)">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="11" width="9" height="9" rx="1"/><circle cx="16" cy="8" r="5"/></svg>
            </button>
            <button class="tool" type="button" data-tool="curve" title="곡선 (C)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 18C7 6 17 19 20 6"/><path d="M4 18l5-9M20 6l-5 9" stroke-dasharray="2 2"/><rect x="2.5" y="16.5" width="3" height="3"/><rect x="18.5" y="4.5" width="3" height="3"/></svg>
            </button>
            <button class="tool" type="button" data-tool="guide" title="가상 선 (L)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4 20L20 4" stroke-dasharray="3 3"/><circle cx="4" cy="20" r="1.5"/><circle cx="20" cy="4" r="1.5"/></svg>
            </button>
            <button class="tool" type="button" data-tool="fill" title="채우기 (F)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M4.5 11.5l7-7 7.5 7.5-7 7a1.5 1.5 0 0 1-2 0l-5.5-5.5a1.5 1.5 0 0 1 0-2z"/><path d="M4 12h15"/><path d="M20.5 15.5c.8 1.3 1.5 2.3 1.5 3a1.5 1.5 0 0 1-3 0c0-.7.7-1.7 1.5-3z"/></svg>
            </button>
            <button class="tool" type="button" data-tool="eraser" title="지우개 (E)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4.6 15.4l9.8-9.8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8.2z"/><path d="M9 11l5 5"/></svg>
            </button>
            <button class="tool" type="button" data-tool="blur" title="흐림 (B)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5" opacity=".6"/></svg>
            </button>
            <button class="tool" type="button" data-tool="select" title="영역 선택 (S)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M5 12.5C3.6 11.5 3 10.3 3 9c0-3.3 4-6 9-6s9 2.7 9 6-4 6-9 6c-1 0-2-.1-2.9-.3" stroke-dasharray="2.5 3"/><circle cx="7" cy="16" r="2"/><path d="M7 18c0 1.5-1 2.5-2 3"/></svg>
            </button>
            <button class="tool" type="button" data-tool="paste" title="붙여넣기 (V)">
              <svg class="ico" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4M9 10h6M9 14h4"/></svg>
            </button>
            <button class="tool" type="button" data-tool="symmetry" title="자동 대칭 (Y)">
              <svg class="ico" viewBox="0 0 24 24"><path d="M12 2v20" stroke-dasharray="2.5 2"/><path d="M9 6L4 12l5 6z"/><path d="M15 6l5 6-5 6z"/></svg>
            </button>
            <button class="tool" type="button" data-tool="underlay" title="밑그림 (U)">
              <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" stroke-dasharray="3 2"/><circle cx="9" cy="10" r="1.5"/><path d="M20 16l-4.5-4.5L8 19"/></svg>
            </button>
          </div>

          <span id="sep-color" class="tool-sep"></span>
          <div id="color-group" class="color-group">
            <div id="swatches" class="swatches"></div>
            <label class="color-custom" title="색 고르기">
              <input id="color-input" type="color" value="#1b1b1f">
              <span class="color-preview"></span>
            </label>
          </div>

          <span id="sep-size" class="tool-sep"></span>
          <div id="size-group" class="size-ctl">
            <span id="size-dot" class="size-dot"></span>
            <input id="size-input" class="size-range" type="range" min="1" max="120" step="1" value="8" aria-label="굵기">
            <span id="size-value" class="size-value">8</span>
          </div>
        </aside>

        <div id="selection-bar" class="selection-bar" hidden>
          <span id="selection-count" class="sel-count"></span>
          <button type="button" data-act="copy" title="복사 (Ctrl+C)">
            <svg class="ico" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>복사</span>
          </button>
          <button type="button" data-act="rotate" title="90° 돌리기">
            <svg class="ico" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span>90°</span>
          </button>
          <button type="button" data-act="flipx" title="좌우 반전">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2.5 2"/><path d="M9 7L4 17h5z"/><path d="M15 7l5 10h-5z"/></svg><span>좌우</span>
          </button>
          <button type="button" data-act="flipy" title="상하 반전">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 12h18" stroke-dasharray="2.5 2"/><path d="M7 9L17 4v5z"/><path d="M7 15l10 5v-5z"/></svg><span>상하</span>
          </button>
          <button type="button" data-act="group" title="그룹화 (Ctrl+G)">
            <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/><path d="M2 8V3a1 1 0 0 1 1-1h5M22 16v5a1 1 0 0 1-1 1h-5"/></svg><span>그룹</span>
          </button>
          <button type="button" data-act="ungroup" title="그룹 풀기 (Ctrl+Shift+G)">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg><span>풀기</span>
          </button>
          <button type="button" data-act="delete" class="danger" title="삭제 (Delete)">
            <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>삭제</span>
          </button>
          <button type="button" data-act="clear" title="선택 해제 (Esc)">
            <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div id="paste-popup" class="paste-popup" hidden>
          <header>
            <span>붙여넣기</span>
            <small>복사한 것 중 하나를 고르세요</small>
          </header>
          <div id="paste-list" class="paste-list"></div>
        </div>

        <div class="zoom-ctl">
          <button id="btn-zoom-out" class="icon-btn" type="button" title="축소">
            <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
          </button>
          <button id="zoom-value" class="zoom-value" type="button" title="100%로">100%</button>
          <button id="btn-zoom-in" class="icon-btn" type="button" title="확대">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="btn-fit" class="icon-btn" type="button" title="화면에 맞추기">
            <svg class="ico" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>
      </div>

      <aside id="layers" class="layers" hidden>
        <header class="layers-head">
          <h3>레이어</h3>
          <span id="layer-count" class="layer-count"></span>
          <button id="btn-autogroup" class="auto-group-btn" type="button" aria-pressed="false">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>
            <span>자동 그룹</span>
          </button>
        </header>
        <div id="layer-actions" class="layer-actions">
          <button type="button" data-act="group" title="선택한 레이어 그룹화">
            <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/><path d="M2 8V3a1 1 0 0 1 1-1h5M22 16v5a1 1 0 0 1-1 1h-5"/></svg>
          </button>
          <button type="button" data-act="ungroup" title="그룹 풀기">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1" stroke-dasharray="2 2"/></svg>
          </button>
          <span class="la-sep"></span>
          <button type="button" data-act="front" title="맨 앞으로">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M5 4h14"/></svg>
          </button>
          <button type="button" data-act="forward" title="앞으로">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
          <button type="button" data-act="backward" title="뒤로">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
          </button>
          <button type="button" data-act="back" title="맨 뒤로">
            <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg>
          </button>
          <span class="la-sep"></span>
          <button type="button" data-act="to-underlay" title="밑그림으로 바꾸기">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" stroke-dasharray="3 2"/><path d="M12 8v7M9 12l3 3 3-3"/></svg>
          </button>
          <button type="button" data-act="from-underlay" title="밑그림 해제 (일반 레이어로)">
            <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 16V9M9 12l3-3 3 3"/></svg>
          </button>
          <span class="la-sep"></span>
          <button type="button" data-act="delete" class="danger" title="삭제">
            <svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
        <p id="layer-hint" class="layer-hint">레이어를 눌러 여러 개 선택할 수 있어요</p>
        <ol id="layer-list" class="layer-list"></ol>
        <p id="layers-empty" class="layers-empty">아직 레이어가 없어요.<br>선 하나, 도형 하나가 레이어 하나가 돼요.</p>
      </aside>
    </div>
  </section>

  <!-- 새 프로젝트 대화상자 -->
  <div id="modal-new" class="modal" hidden>
    <form id="form-new" class="dialog" autocomplete="off">
      <header class="dialog-head">
        <h2>새 프로젝트</h2>
        <button id="btn-new-close" class="icon-btn" type="button" title="닫기">
          <svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span class="field-label">이름</span>
        <input id="new-name" class="input" type="text" maxlength="60">
      </label>

      <div class="field">
        <span class="field-label">비율</span>
        <div id="ratio-grid" class="ratio-grid"></div>
      </div>

      <div id="custom-fields" class="field custom-fields" hidden>
        <span class="field-label">커스텀 비율</span>
        <div class="custom-row">
          <input id="custom-w" class="input num" type="number" min="1" max="100" step="any" value="5" inputmode="decimal" aria-label="가로 비율">
          <span class="colon">:</span>
          <input id="custom-h" class="input num" type="number" min="1" max="100" step="any" value="7" inputmode="decimal" aria-label="세로 비율">
        </div>
      </div>

      <div class="field">
        <span class="field-label">해상도 (긴 변)</span>
        <div id="res-group" class="segmented">
          <button type="button" data-res="1024">1024</button>
          <button type="button" data-res="2048" class="active">2048</button>
          <button type="button" data-res="4096">4096</button>
        </div>
      </div>

      <footer class="dialog-foot">
        <span id="size-preview" class="size-preview"></span>
        <div class="dialog-actions">
          <button id="btn-new-cancel" class="btn" type="button">취소</button>
          <button class="btn primary" type="submit">만들기</button>
        </div>
      </footer>
    </form>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
